services:
  sec-reports:
    image: ghcr.io/terrencestella/sec-annual-reports:latest
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Only change the host side (left of the colon)
      - ./data:/app/data
    environment:
      # Replace with your contact details, required by the SEC
      SEC_IDENTITY: "Your Name your.email@example.com"
      TZ: Europe/Amsterdam
      RUN_TIME: "07:00"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
