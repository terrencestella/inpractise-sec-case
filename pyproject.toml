[project]
name = "sec-reports"
version = "0.1.0"
description = "Tracks SEC annual reports and fiscal years for followed companies"
readme = "README.md"
authors = [
    { name = "Terrence Stella", email = "terrence.s.stella@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10,<4",
    "edgartools==6.3.0",
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.8.13,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
